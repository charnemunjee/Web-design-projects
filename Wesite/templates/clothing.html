
{% extends "base.html" %}
{% block content %}
  <h2 style="margin-top:10px">VO2 max — Movesby_Meg Clothing</h2>
  <p class="smallmuted">Performance gym wear hand-picked by Meg.</p>
  <div class="grid" style="margin-top:12px">
    {% for item in items %}
      <div class="card text-center">
        <img src="{{ item.image }}" alt="{{ item.name }}" class="prod-img">
        <div class="prod-info"><h4>{{ item.name }}</h4><div class="price">{{ item.price }}</div><p class="smallmuted">{{ item.desc }}</p><a class="btn-primary" href="#">Buy on VO2 max (demo)</a></div>
      </div>
    {% endfor %}
  </div>
{% endblock %}
