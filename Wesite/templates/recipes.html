
{% extends "base.html" %}
{% block content %}
  <h2 style="margin-top:10px">Healthy recipes</h2>
  {% for r in recipes %}
    <div class="card" style="display:flex;gap:12px;align-items:center;margin-top:12px">
      <img src="{{ r.image }}" alt="{{ r.title }}" style="width:200px;height:140px;object-fit:cover;border-radius:8px">
      <div><h4>{{ r.title }}</h4><p class="smallmuted">{{ r.desc }}</p></div>
    </div>
  {% endfor %}
{% endblock %}
